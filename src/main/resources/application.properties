spring.application.name=vehicle-registration-system

spring.profiles.default=dev

spring.config.import=optional:file:./config/application-local.properties

spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
server.error.include-message=never

vrs.registration.validity-years=15

# JWT authentication. JWT_SECRET must be at least 32 random characters; keep it out of git
# (put it in config/application-local.properties or an environment variable).
vrs.jwt.secret=${JWT_SECRET:}
vrs.jwt.lifetime-minutes=60
vrs.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# Supporting documents (invoice, insurance, identity proof): PDF/JPG/PNG up to 5 MB each,
# stored on local disk outside the web root. Override the folder with VRS_UPLOAD_DIR.
vrs.documents.storage-location=${VRS_UPLOAD_DIR:./uploads}
vrs.documents.max-size-bytes=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# First SYSTEM_ADMIN, created at startup only when none exists (employees cannot self-register).
vrs.bootstrap.admin-email=${VRS_ADMIN_EMAIL:}
vrs.bootstrap.admin-password=${VRS_ADMIN_PASSWORD:}

