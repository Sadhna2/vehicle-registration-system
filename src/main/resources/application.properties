spring.application.name=vehicle-registration-system

spring.profiles.default=dev

spring.config.import=optional:file:./config/application-local.properties

spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
server.error.include-message=never

vrs.registration.validity-years=15

vrs.jwt.secret=${JWT_SECRET}
vrs.jwt.lifetime-minutes=30
vrs.jwt.cookie-secure=false

vrs.cors.allowed-origins=http\://localhost:5173,http\://127.0.0.1:5173